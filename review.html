*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:18px;font-family:"DM Sans",sans-serif;background:#f3eee3;color:#12302c}

a{display:inline-flex;align-items:center;justify-content:center;min-height:52px;margin-top:28px;padding:0 22px;border-radius:999px;background:#0b5c55;color:#fff;text-decoration:none;font-size:10px;font-weight:800;letter-spacing:.09em;text-transform:uppercase}
@media(max-width:620px){.card{padding:38px 18px;border-radius:22px}a{width:100%}}
