<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  min-height:100svh;
  display:grid;
  place-items:center;
  padding:22px;
  font-family:"DM Sans",sans-serif;
  color:#fffdf8;
  background:
    radial-gradient(circle at 78% 18%,rgba(131,234,220,.13),transparent 24rem),
    linear-gradient(145deg,#063e39,#052f2c);
}
.card{
  width:min(720px,100%);
  padding:58px 34px;
  border-radius:32px;
  text-align:center;
  border:1px solid rgba(255,255,255,.14);
  background:linear-gradient(145deg,rgba(255,255,255,.08),rgba(255,255,255,.025));
  box-shadow:0 24px 70px rgba(0,0,0,.16);
}
.check{
  width:74px;height:74px;border-radius:50%;
  display:grid;place-items:center;
  margin:0 auto 22px;
  background:#83eadc;color:#063e39;
  font-size:32px;font-weight:700;
}
.kicker{
  margin:0 0 12px;
  color:#83eadc;
  font-size:10px;font-weight:700;
  letter-spacing:.17em;text-transform:uppercase;
}
h1{
  margin:0;
  font-family:"Noto Serif Display",Georgia,serif;
  font-size:clamp(42px,7vw,70px);
  line-height:.98;
  font-weight:500;
  letter-spacing:-.035em;
}
p{
  max-width:520px;
  margin:20px auto 0;
  color:rgba(255,255,255,.68);
  font-size:15px;
  line-height:1.72;
}
a{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:52px;
  margin-top:30px;
  padding:0 22px;
  border-radius:999px;
  background:#83eadc;
  color:#063e39;
  text-decoration:none;
  font-weight:700;
  font-size:11px;
  letter-spacing:.1em;
  text-transform:uppercase;
}
@media(max-width:620px){
  body{padding:16px}
  .card{padding:42px 20px;border-radius:24px}
  .check{width:64px;height:64px;font-size:28px}
  h1{font-size:46px}
  p{font-size:13px;line-height:1.65}
  a{width:100%;margin-top:24px}
}
</style>

<main class="card">
  <div class="check">✓</div>
  <div class="kicker">Đăng ký thành công</div>
  <h1>KES cảm ơn Quý khách.</h1>
  <p>Chúng tôi sẽ liên hệ trong thời gian sớm nhất.</p>
  <a href="/">Quay lại trang chính</a>
</main>
