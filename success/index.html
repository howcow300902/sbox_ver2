<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#063e39">
<title>Đăng ký SBOX thành công | KES</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Serif+Display:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:18px;font-family:"DM Sans",sans-serif;background:#063e39;color:#fffdf8}
.card{width:min(620px,100%);padding:46px 24px;border-radius:28px;text-align:center;border:1px solid rgba(255,255,255,.14);background:linear-gradient(145deg,rgba(255,255,255,.08),rgba(255,255,255,.025))}
.check{width:66px;height:66px;border-radius:50%;display:grid;place-items:center;margin:0 auto 20px;background:#83eadc;color:#063e39;font-size:29px;font-weight:700}
h1{margin:0;font-family:"Noto Serif Display",Georgia,serif;font-size:clamp(40px,9vw,64px);font-weight:500;line-height:1}
p{max-width:460px;margin:18px auto 0;color:rgba(255,255,255,.68);font-size:14px;line-height:1.7}
a{display:inline-flex;align-items:center;justify-content:center;min-height:52px;margin-top:28px;padding:0 22px;border-radius:999px;background:#83eadc;color:#063e39;text-decoration:none;font-size:10px;font-weight:800;letter-spacing:.09em;text-transform:uppercase}
@media(max-width:620px){.card{padding:38px 18px;border-radius:22px}a{width:100%}}
</style>
</head>
<body>
<main class="card">
  <div class="check">✓</div>
  <h1>KES cảm ơn Quý khách.</h1>
  <p>Thông tin đăng ký SBOX đã được ghi nhận. Chúng tôi sẽ liên hệ trong thời gian sớm nhất để xác nhận thông tin nhận bộ mẫu.</p>
  <a href="/">Quay lại trang chính</a>
</main>
<script>
window.dataLayer=window.dataLayer||[];
window.dataLayer.push({event:'sbox_registration_success',form_name:'kes-sbox-registration',screening_status:'qualified'});
</script>
</body>
</html>
